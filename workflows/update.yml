name: update-data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas numpy
      - run: python scripts/build_data.py
        env:
          POLYSCAN_KEY: ${{ secrets.POLYSCAN_KEY }}
      - run: |
          git config user.name "sut-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json data/transfers.csv
          git diff --cached --quiet || git commit -m "data update $(date -u +%Y-%m-%dT%H:%M)"
          git push
